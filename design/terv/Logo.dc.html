<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Bárányka logó</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kavoon&amp;family=Nunito:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: inline-flex; align-items: center; gap: {{gap}}px; font-family: 'Nunito', sans-serif; color: #5A4638">
  <img src="kepek/8ebb098ea035b47adc0e81a7b1f0eb45.webp" alt="Bárányka Keresztyén Óvoda logó: bárány a tenyérben" width="{{w}}" height="{{h}}" style="display: block; width: {{w}}px; height: {{h}}px; object-fit: contain">
  <sc-if value="{{felirat}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; flex-direction: column; line-height: 1.04">
      <span style="font-family: 'Kavoon', 'Nunito', cursive; font-size: {{f}}px; color: {{szin}}; text-shadow: {{arnyek}}; white-space: nowrap">Bárányka</span>
      <span style="font-family: 'Kavoon', 'Nunito', cursive; font-size: {{f}}px; color: {{szin}}; text-shadow: {{arnyek}}; white-space: nowrap">Keresztyén Óvoda</span>
    </span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"meret":{"editor":"int","default":64,"min":24,"max":400,"unit":"px"},"felirat":{"editor":"boolean","default":true},"vilagos":{"editor":"boolean","default":false},"$preview":{"width":440,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    const m = Number(this.props.meret ?? 64);
    const vil = this.props.vilagos ?? false;
    return {
      h: m,
      w: Math.round(m * 1400 / 976),
      gap: Math.round(m * 0.18),
      f: Math.round(m * 0.36),
      felirat: this.props.felirat ?? true,
      szin: vil ? '#FFFFFF' : '#5A4638',
      arnyek: vil ? '2px 2px 0 rgba(0,0,0,0.28)' : '2px 2px 0 #E3C99F'
    };
  }
}
</script>
</body>
</html>
